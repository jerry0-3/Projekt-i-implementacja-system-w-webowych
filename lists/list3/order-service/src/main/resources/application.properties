# Ustawienie portu dla Order Service
server.port=8080

# Konfiguracja bazy danych H2 
spring.datasource.url=jdbc:h2:file:./data/orderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Włączenie konsoli H2 pod adresem localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Automatyczne tworzenie schematu bazy na podstawie encji
spring.jpa.hibernate.ddl-auto=update

# Wystawienie definicji REST pod localhost:8080/swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html