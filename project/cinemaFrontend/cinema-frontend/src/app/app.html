<header>
  <div class="logo">
    <h1 routerLink="/repertoire">🎟️ Kino</h1>
  </div>
  
  <nav>
    <a routerLink="/repertoire" routerLinkActive="active">Repertuar</a>

    @if (authService.isLoggedIn()) {
      <a routerLink="/inspector/scanner" routerLinkActive="active">Panel Biletera</a>
      <button class="btn-logout-nav" (click)="onLogout()">Wyloguj</button>
    } @else {
      <a routerLink="/inspector/login" routerLinkActive="active">Logowanie</a>
    }
  </nav>
</header>

<main>
  <router-outlet></router-outlet>
</main>
