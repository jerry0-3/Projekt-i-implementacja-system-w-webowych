<article class="m-3">
    <h2>Edit Book</h2>
  
    <!-- Jeśli formularz istnieje (został zainicjowany w ngOnInit) -->
    @if (bookForm) {
      <form [formGroup]="bookForm" (ngSubmit)="onSave()" class="card p-3 mt-3">
        
        <!-- Tytuł -->
        <div class="mb-3">
          <label for="title" class="form-label">Title *</label>
          <input 
            type="text" 
            id="title" 
            class="form-control" 
            formControlName="title"
            [class.is-invalid]="bookForm.get('title')?.invalid && bookForm.get('title')?.touched"
          >
        </div>
  
        <!-- Autor -->
        <div class="mb-3">
          <label for="author" class="form-label">Author *</label>
          <input 
            type="text" 
            id="author" 
            class="form-control" 
            formControlName="author"
            [class.is-invalid]="bookForm.get('author')?.invalid && bookForm.get('author')?.touched"
          >
        </div>
  
        <!-- Rok -->
        <div class="mb-3">
          <label for="year" class="form-label">Year *</label>
          <input 
            type="number" 
            id="year" 
            class="form-control" 
            formControlName="year"
            [class.is-invalid]="bookForm.get('year')?.invalid && bookForm.get('year')?.touched"
          >
        </div>
  
        <!-- Opis -->
        <div class="mb-3">
          <label for="description" class="form-label">Description</label>
          <textarea 
            id="description" 
            class="form-control" 
            rows="4" 
            formControlName="description"
            [class.is-invalid]="bookForm.get('description')?.invalid && bookForm.get('description')?.touched"
          ></textarea>
        </div>
  
        <div class="d-flex gap-2">
          <!-- (e) Przycisk Save. Nieaktywny gdy formularz jest invalid LUB nie został zmieniony (pristine) -->
          <button 
            type="submit" 
            class="btn btn-success" 
            [disabled]="bookForm.invalid || bookForm.pristine">
            Save
          </button>
          
          <!-- (f) Przycisk Cancel -->
          <button 
            type="button" 
            class="btn btn-secondary" 
            (click)="onCancel()">
            Cancel
          </button>
        </div>
      </form>
    }
  </article>
