server:
  port: 8091

spring:
  datasource:
    url: jdbc:h2:mem:testttdb;Mode=Oracle
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  sql:
    init:
      platform: h2
  jpa:
    hibernate:
      ddl-auto: none
    generate-ddl: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

logging:
  level:
    org.hibernate.orm.jdbc.bind: TRACE
