spring.application.name=cinemaCommandService
server.port=8080

# Baza danych H2 dla Zapisu
spring.datasource.url=jdbc:h2:file:./data/cinema_command_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Włączamy statystyki Hibernate
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# Włączenie konsoli H2 pod adresem http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI (dostępny pod: http://localhost:8080/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html

# Konfiguracja inicjalizacji danych początkowych (data.sql)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true