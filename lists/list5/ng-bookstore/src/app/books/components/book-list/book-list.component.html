<article class="m-3">
  <h2>List of all books</h2>

  <!-- Nowe pole wyszukiwania 5a -->
  <div class="mb-4">
    <input 
      type="search" 
      class="form-control" 
      placeholder="Search for books (type at least 2 characters)..." 
      [formControl]="searchControl">
  </div>

  <section class="d-flex flex-column gap-2">
    @for (book of books; track book.id) {
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">{{ book.title }}</h5>
          <h6 class="card-subtitle mb-2 text-muted">{{ book.author }}</h6>
          <p class="card-text">
            {{ book.description }}
          </p>
          <a [routerLink]="[book.id, 'edit']" class="card-link">Edit</a>
          <a [routerLink]="[book.id, 'reviews']" class="card-link">Reviews</a>
        </div>
      </div>
    }

    <!-- Wiadomość gdy wyszukiwanie nic nie zwróci -->
    @if (books.length === 0) {
      <div class="alert alert-warning">
        No books found matching your search criteria.
      </div>
    }
  </section>
</article>
