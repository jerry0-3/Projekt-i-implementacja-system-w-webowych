spring.application.name=cinemaCommandService
server.port=8082

# Baza danych H2 dla Zapisu
spring.datasource.url=jdbc:h2:mem:commanddb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Włączamy statystyki Hibernate, by widzieć bulk operacje i zapytania
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger UI (dostępny pod: http://localhost:8082/swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html